<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本日のメモ - 詳細画面</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 16:9 の詳細画面 -->
  <div class="screen-wrapper">
    <main class="app-screen">

      <!-- ⑬画面タイトル -->
      <header class="title-bar">
        <h1 class="title-bar__text">本日のメモ</h1>
      </header>

      <!-- ⑭見出し4 / ⑮見出し5 + ⑯入力・⑰選択 + ⑳表示 -->
      <div class="content-area">

        <!-- 左側：レイアウト図上、余白として空けられている領域 -->
        <section class="panel panel--blank" aria-hidden="true"></section>

        <!-- ⑭見出し4 / ⑯入力・⑰選択：本日のメモ 各行の入力欄 -->
        <section class="panel panel--input">
          <h2 class="panel__heading" id="date-heading">2026/09/10</h2>
          <div class="panel__body">
            <ul class="input-list" id="input-list">
              <!-- JS（detail.js）が読み込み時に、選択中の日付のデータで
                   このリストを描画し直します。以下は初期表示用です。 -->
              <li class="input-list__row">
                <input type="text" class="input-list__field" value="14:00〜 定例会議">
                <input type="checkbox" class="input-list__check">
              </li>
              <li class="input-list__row">
                <input type="text" class="input-list__field" value="資料を事前に確認しておく">
                <input type="checkbox" class="input-list__check" checked>
              </li>
              <li class="input-list__row">
                <input type="text" class="input-list__field" value="買い物リストの整理">
                <input type="checkbox" class="input-list__check" checked>
              </li>
              <li class="input-list__row">
                <input type="text" class="input-list__field" value="企画書のレビューを行う">
                <input type="checkbox" class="input-list__check" checked>
              </li>
              <li class="input-list__row">
                <input type="text" class="input-list__field" value="メールの返信をする">
                <input type="checkbox" class="input-list__check">
              </li>
              <li class="input-list__row">
                <input type="text" class="input-list__field" value="週次報告を提出する">
                <input type="checkbox" class="input-list__check" checked>
              </li>
              <li class="input-list__row">
                <input type="text" class="input-list__field" value="">
                <input type="checkbox" class="input-list__check">
              </li>
              <li class="input-list__row">
                <input type="text" class="input-list__field" value="">
                <input type="checkbox" class="input-list__check">
              </li>
              <li class="input-list__row">
                <input type="text" class="input-list__field" value="">
                <input type="checkbox" class="input-list__check">
              </li>
              <li class="input-list__row">
                <input type="text" class="input-list__field" value="">
                <input type="checkbox" class="input-list__check">
              </li>
            </ul>
          </div>
        </section>

        <!-- ⑮見出し5 / ⑳表示：ToDoリスト（参照表示） -->
        <section class="panel panel--todo">
          <h2 class="panel__heading">ToDoリスト</h2>
          <div class="panel__body">
            <ul class="todo-list" id="todo-display">
              <!-- JS（detail.js）が読み込み時に、左側でチェックが入っている
                   行から、このToDoリストを描画し直します。以下は初期表示用です。 -->
              <li class="todo-list__item">
                <span class="todo-list__check"></span>
                <span class="todo-list__label">資料を事前に確認しておく</span>
              </li>
              <li class="todo-list__item">
                <span class="todo-list__check"></span>
                <span class="todo-list__label">買い物リストの整理</span>
              </li>
              <li class="todo-list__item">
                <span class="todo-list__check"></span>
                <span class="todo-list__label">企画書のレビューを行う</span>
              </li>
              <li class="todo-list__item">
                <span class="todo-list__check"></span>
                <span class="todo-list__label">週次報告を提出する</span>
              </li>
            </ul>
          </div>
        </section>

      </div>

      <!-- ⑱遷移・確定（戻る） / ⑲保存 -->
      <footer class="action-bar">
        <button type="button" class="action-bar__button action-bar__button--sub">戻る</button>
        <button type="button" class="action-bar__button" id="save-button">保存</button>
        <span id="save-status" class="save-status" aria-live="polite"></span>
      </footer>

    </main>
  </div>

  <script src="detail.js"></script>
</body>
</html>
