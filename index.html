<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メモ帳 - 基本画面</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 16:9 の基本画面 -->
  <div class="screen-wrapper">
    <main class="app-screen">

      <!-- ①画面タイトル -->
      <header class="title-bar">
        <h1 class="title-bar__text">メモ帳</h1>
      </header>

      <!-- ②③④見出し + ⑤⑥⑦表示 + ⑧選択 -->
      <div class="content-area">

        <!-- ②見出し1 / ⑤表示：本日のメモ -->
        <section class="panel panel--memo">
          <h2 class="panel__heading">本日のメモ</h2>
          <div class="panel__body">
            <p class="memo-text">
              14:00〜 定例会議<br>
              資料を事前に確認しておく<br>
              <br>
              買い物リストの整理も忘れずに
            </p>
          </div>
        </section>

        <!-- ③見出し2 / ⑥表示・⑧選択：カレンダー -->
        <section class="panel panel--calendar">
          <h2 class="panel__heading">カレンダー</h2>
          <div class="panel__body">
            <div class="calendar">
              <div class="calendar__month">2026年9月</div>
              <table class="calendar__table">
                <thead>
                  <tr>
                    <th class="is-sun">日</th>
                    <th>月</th>
                    <th>火</th>
                    <th>水</th>
                    <th>木</th>
                    <th>金</th>
                    <th class="is-sat">土</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td class="is-blank"></td>
                    <td class="is-blank"></td>
                    <td>1</td>
                    <td>2</td>
                    <td>3</td>
                    <td>4</td>
                    <td>5</td>
                  </tr>
                  <tr>
                    <td>6</td>
                    <td>7</td>
                    <td>8</td>
                    <td>9</td>
                    <td class="is-today"><button type="button" class="calendar__day">10</button></td>
                    <td>11</td>
                    <td>12</td>
                  </tr>
                  <tr>
                    <td>13</td>
                    <td>14</td>
                    <td>15</td>
                    <td>16</td>
                    <td>17</td>
                    <td>18</td>
                    <td>19</td>
                  </tr>
                  <tr>
                    <td>20</td>
                    <td>21</td>
                    <td>22</td>
                    <td>23</td>
                    <td>24</td>
                    <td>25</td>
                    <td>26</td>
                  </tr>
                  <tr>
                    <td>27</td>
                    <td>28</td>
                    <td>29</td>
                    <td>30</td>
                    <td class="is-blank"></td>
                    <td class="is-blank"></td>
                    <td class="is-blank"></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- ④見出し3 / ⑦表示：ToDoリスト -->
        <section class="panel panel--todo">
          <h2 class="panel__heading">ToDoリスト</h2>
          <div class="panel__body">
            <ul class="todo-list">
              <li class="todo-list__item">
                <span class="todo-list__check"></span>
                <span class="todo-list__label">企画書のレビュー</span>
              </li>
              <li class="todo-list__item">
                <span class="todo-list__check"></span>
                <span class="todo-list__label">メールの返信</span>
              </li>
              <li class="todo-list__item is-done">
                <span class="todo-list__check"></span>
                <span class="todo-list__label">週次報告の提出</span>
              </li>
              <li class="todo-list__item">
                <span class="todo-list__check"></span>
                <span class="todo-list__label">資料の印刷</span>
              </li>
            </ul>
          </div>
        </section>

      </div>

      <!-- ⑨遷移：編集ボタン -->
      <footer class="action-bar">
        <button type="button" class="action-bar__button">編集</button>
      </footer>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
