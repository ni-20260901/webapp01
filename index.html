<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メモ帳 - 基本画面</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 16:9 の基本画面 -->
  <div class="screen-wrapper">
    <main class="app-screen">

      <!-- ①画面タイトル -->
      <header class="title-bar">
        <h1 class="title-bar__text">メモ帳</h1>
      </header>

      <!-- ②③④見出し + ⑤⑥⑦表示 + ⑧選択 -->
      <div class="content-area">

        <!-- ②見出し1 / ⑤表示：本日のメモ -->
        <section class="panel panel--memo">
          <h2 class="panel__heading">本日のメモ</h2>
          <div class="panel__body">
            <p class="memo-text" id="memo-display">
              <!-- JS（script.js）が読み込み時に、選択中の日付のデータで
                   この内容を描画し直します。以下は初期表示用です。 -->
              14:00〜 定例会議<br>
              資料を事前に確認しておく<br>
              買い物リストの整理<br>
              企画書のレビューを行う<br>
              メールの返信をする<br>
              週次報告を提出する
            </p>
          </div>
        </section>

        <!-- ③見出し2 / ⑥表示・⑧選択：カレンダー -->
        <section class="panel panel--calendar">
          <h2 class="panel__heading">カレンダー</h2>
          <div class="panel__body">
            <div class="calendar">
              <div class="calendar__month">2026年9月</div>
              <table class="calendar__table">
                <thead>
                  <tr>
                    <th class="is-sun">日</th>
                    <th>月</th>
                    <th>火</th>
                    <th>水</th>
                    <th>木</th>
                    <th>金</th>
                    <th class="is-sat">土</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td class="is-blank"></td>
                    <td class="is-blank"></td>
                    <td><button type="button" class="calendar__day" data-day="1">1</button></td>
                    <td><button type="button" class="calendar__day" data-day="2">2</button></td>
                    <td><button type="button" class="calendar__day" data-day="3">3</button></td>
                    <td><button type="button" class="calendar__day" data-day="4">4</button></td>
                    <td><button type="button" class="calendar__day" data-day="5">5</button></td>
                  </tr>
                  <tr>
                    <td><button type="button" class="calendar__day" data-day="6">6</button></td>
                    <td><button type="button" class="calendar__day" data-day="7">7</button></td>
                    <td><button type="button" class="calendar__day" data-day="8">8</button></td>
                    <td><button type="button" class="calendar__day" data-day="9">9</button></td>
                    <td class="is-today"><button type="button" class="calendar__day" data-day="10">10</button></td>
                    <td><button type="button" class="calendar__day" data-day="11">11</button></td>
                    <td><button type="button" class="calendar__day" data-day="12">12</button></td>
                  </tr>
                  <tr>
                    <td><button type="button" class="calendar__day" data-day="13">13</button></td>
                    <td><button type="button" class="calendar__day" data-day="14">14</button></td>
                    <td><button type="button" class="calendar__day" data-day="15">15</button></td>
                    <td><button type="button" class="calendar__day" data-day="16">16</button></td>
                    <td><button type="button" class="calendar__day" data-day="17">17</button></td>
                    <td><button type="button" class="calendar__day" data-day="18">18</button></td>
                    <td><button type="button" class="calendar__day" data-day="19">19</button></td>
                  </tr>
                  <tr>
                    <td><button type="button" class="calendar__day" data-day="20">20</button></td>
                    <td><button type="button" class="calendar__day" data-day="21">21</button></td>
                    <td><button type="button" class="calendar__day" data-day="22">22</button></td>
                    <td><button type="button" class="calendar__day" data-day="23">23</button></td>
                    <td><button type="button" class="calendar__day" data-day="24">24</button></td>
                    <td><button type="button" class="calendar__day" data-day="25">25</button></td>
                    <td><button type="button" class="calendar__day" data-day="26">26</button></td>
                  </tr>
                  <tr>
                    <td><button type="button" class="calendar__day" data-day="27">27</button></td>
                    <td><button type="button" class="calendar__day" data-day="28">28</button></td>
                    <td><button type="button" class="calendar__day" data-day="29">29</button></td>
                    <td><button type="button" class="calendar__day" data-day="30">30</button></td>
                    <td class="is-blank"></td>
                    <td class="is-blank"></td>
                    <td class="is-blank"></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- ④見出し3 / ⑦表示：ToDoリスト -->
        <section class="panel panel--todo">
          <h2 class="panel__heading">ToDoリスト</h2>
          <div class="panel__body">
            <ul class="todo-list" id="todo-display">
              <!-- JS（script.js）が読み込み時に、詳細画面でチェックが
                   入っている行から、このToDoリストを描画し直します。
                   以下は初期表示用です。 -->
              <li class="todo-list__item">
                <span class="todo-list__check"></span>
                <span class="todo-list__label">資料を事前に確認しておく</span>
              </li>
              <li class="todo-list__item">
                <span class="todo-list__check"></span>
                <span class="todo-list__label">買い物リストの整理</span>
              </li>
              <li class="todo-list__item">
                <span class="todo-list__check"></span>
                <span class="todo-list__label">企画書のレビューを行う</span>
              </li>
              <li class="todo-list__item">
                <span class="todo-list__check"></span>
                <span class="todo-list__label">週次報告を提出する</span>
              </li>
            </ul>
          </div>
        </section>

      </div>

      <!-- ⑨遷移：編集ボタン -->
      <footer class="action-bar">
        <button type="button" class="action-bar__button" id="edit-button">編集</button>
      </footer>

    </main>
  </div>

  <script src="storage.js"></script>
  <script src="script.js"></script>
</body>
</html>
